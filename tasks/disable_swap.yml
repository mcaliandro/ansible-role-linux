---

- name: "Disable swap: get list of active swap"
  ansible.builtin.shell: |
    swapon -s | awk 'NR>1 && NF>0 {print $1}'
  register: swap_list_cmd

- name: "Disable swap: disable only if active"
  block:
    - name: "Disable swap: disable all active swap"
      ansible.builtin.shell: swapoff -a
      notify: Reboot

    - name: "Disable swap: remove any swap entry from fstab"
      ansible.posix.mount:
        path: none  
        src: "{{ item }}"
        state: absent
      loop: "{{ swap_list_cmd.stdout_lines }}"
  when: swap_list_cmd.stdout_lines | length > 0
