---

- name: Include OS specific variables
  ansible.builtin.include_vars: "vars/{{ ansible_facts.os_family }}.yml"

- name: Manage packages installation and removal
  ansible.builtin.package:
    name: "{{ item.name | default(item) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ linux_packages }}"
  when: linux_packages | length > 0

- name: Get info about installed packages
  ansible.builtin.package_facts:
    manager: auto

- name: Include assert tasks
  ansible.builtin.include_tasks: assert.yml

- name: Include tasks to remove snapd on Ubuntu host
  ansible.builtin.include_tasks: remove_snapd.yml
  when:
    - ansible_facts.distribution == "Ubuntu"
    - "'snapd' in ansible_facts.packages"
    - linux_remove_snapd

- name: Setup hostname
  ansible.builtin.hostname:
    name: "{{ linux_hostname }}"
  notify: Reboot
  when: linux_hostname | length > 0

- name: Manage configuration of SSH server
  ansible.builtin.lineinfile:
    path: "{{ linux_sshd_default_config_file }}"
    regexp: '^#?{{ item.key }}'
    line: '{{ item.key }} {{ item.value }}'
    validate: /usr/sbin/sshd -t -f %s
  with_dict: "{{ linux_sshd_config }}"
  notify: Restart SSH
  when: linux_sshd_config | length > 0

- name: Include tasks to upload custom sshd dropin files
  ansible.builtin.include_tasks: sshd_dropin.yml
  loop: "{{ linux_sshd_config_dropin_files }}"
  when: linux_sshd_config_dropin_files | length > 0

- name: Include tasks to configure disks and partitions
  ansible.builtin.include_tasks: disks.yml
  loop: "{{ linux_disks }}"
  loop_control:
    label: "{{ disk.device }}"
    loop_var: disk
  when: linux_disks | length > 0

- name: Include tasks to disable swap space
  ansible.builtin.include_tasks: disable_swap.yml
  when: linux_disable_swap

- name: Include tasks to configure swap file
  ansible.builtin.include_tasks: swapfile.yml
  when: 
    - linux_swapfile | length > 0
    - not linux_disable_swap

- name: Include tasks to manage kernel modules
  ansible.builtin.include_tasks: modprobe.yml

- name: Setup kernel parameters using sysctl
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: "{{ linux_sysctl_default_config_file }}"
  with_dict: "{{ linux_sysctl_params }}"
  when: linux_sysctl_params | length > 0

- name: Include tasks to manage custom sysctl dropin files
  ansible.builtin.include_tasks: sysctl_dropin.yml
  loop: "{{ linux_sysctl_config_dropin_files }}"
  when: linux_sysctl_config_dropin_files | length > 0

- name: Reboot if explicitly required
  ansible.builtin.reboot:
    msg: "Variable 'linux_force_reboot' is set to 'true', rebooting"
  when: linux_force_reboot | bool
