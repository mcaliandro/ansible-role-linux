---

- name: "Remove snapd: get list of installed snaps"
  ansible.builtin.shell: |
    snap list | awk 'NR>1 && NF>0 {print $1}'
  register: snap_list_cmd

- name: "Remove snapd: remove installed snaps"
  ansible.builtin.shell: |
    snap remove --purge {{ item }}
  loop: "{{ snap_list_cmd.stdout_lines }}"
  when: snap_list_cmd.stdout_lines | length > 0

- name: "Remove snapd: stop, disable and mask systemd service for snapd"
  ansible.builtin.systemd_service:
    name: snapd
    state: stopped
    enabled: false
    masked: true

- name: "Remove snapd: remove and prune apt package"
  ansible.builtin.apt:
    name: snapd
    state: absent
    autoremove: true
    purge: true
  notify: Reboot

- name: "Remove snapd: prevent snapd installation through apt command"
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/no-snap
    content: |
      Package: snapd
      Pin: release a=*
      Pin-Priority: -1000

- name: "Remove snapd: prune snapd directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/cache/snapd
    - /var/snap
    - /snap
