---

# Whether to reboot the machine at the end of this role's execution.
linux_force_reboot: false

# Specify the list of packages to install.
# To remove packages, use the field `state=absent`.
# Example:
#   linux_packages:
#     - { name: pkg_name, state: absent }
linux_packages: []

# Whether to remove or not snapd on Ubuntu host.
linux_remove_snapd: false

# Setup the hostname on the host.
linux_hostname: ""

# Specify the sshd parameters with their values as key-value entries.
# The entries will be stored into the default `sshd_config` file, which path
# is '/etc/ssh/sshd_config'.
linux_sshd_config: {}

# Specify the custom sshd_config dropin files to upload on the remote host.
# To remove dropin files from the remote host, use the field `state=absent`
# Example:
#   linux_sshd_config_dropin_files:
#     - file: 90-custom.conf
#       state: absent
linux_sshd_config_dropin_files: []

# Specify the storage configuration: for each attached disk provide the list
# of partitions to be created, formatted and mounted on the host.
linux_disks: []

# Whether to disable swap space or not.
# NOTE: when `true` and swap file is not configured yet, the tasks for
#       configuring a swap file will be skipped.
linux_disable_swap: false

# Create and configure a swap file on the host.
# Example:
#   linux_swapfile: { size_mb: 4096 }
linux_swapfile: {}

# Specify the list of kernel modules to load.
# To provide also module parameters, use the field `params`.
# Example:
#   linux_modprobe_load:
#     - { name: mod_name, params: "comma_separated_params" }
linux_modprobe_load: []

# Specify the list of kernel modules to blacklist.
linux_modprobe_blacklist: []

# Specify the kernel parameters with their values as key-value entries.
# The entries will be stored into the default `sysctl` file, which path is
# '/etc/sysctl.conf'.
linux_sysctl_params: {}

# Specify the custom sysctl dropin files to upload on the remote host.
# To remove dropin files from the remote host, use the field `state=absent`
# Example:
#   linux_sysctl_config_dropin_files:
#     - file: 90-custom.conf
#       state: absent
linux_sysctl_config_dropin_files: []
